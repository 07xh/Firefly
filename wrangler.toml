name = "firefly"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = ["/admin", "/admin/*", "/api/admin", "/api/admin/*", "/api/auth/*"]

[[kv_namespaces]]
binding = "FIREFLY_SESSIONS"

[vars]
NODE_VERSION = "22"
