<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" role="img" aria-labelledby="title desc">
<title id="title">图 1｜一个三维点的三个正投影</title><desc id="desc">V 保存 x、z；H 保存 x、y；W 保存 y、z。</desc>
<defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#E5EFEC" stroke-width="1"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#809A9D"/></marker></defs>
<rect width="1020" height="700" rx="22" fill="#F4F9F7"/>
<rect x="15" y="15" width="990" height="670" rx="20" fill="#FFFFFF" stroke="#E4EDEB" stroke-width="2"/>
<g font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif">
<text x="52" y="74" font-size="35" fill="#203B41" font-weight="750" >图 1｜一个三维点的三个正投影</text>
<text x="52" y="116" font-size="22" fill="#53717A" font-weight="400" >V 保存 x、z；H 保存 x、y；W 保存 y、z。</text>

