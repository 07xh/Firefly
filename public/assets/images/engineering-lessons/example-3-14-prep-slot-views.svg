<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="title desc">
<title id="title">盲槽组合体三视图，逐条判断实线与虚线</title>
<desc id="desc">自拟案例：80乘50乘40的长方体，顶面中心有28乘20、深14的矩形盲槽。主视图与左视图均画隐藏U形线，俯视图槽口四边为实线。</desc>
<style>
.bg{fill:#f5f8ff}.panel{fill:#fff;stroke:#dce5f6;stroke-width:1.5}.edge{fill:none;stroke:#14233e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hidden{fill:none;stroke:#ad5d28;stroke-width:2.6;stroke-dasharray:9 6;stroke-linejoin:round}.label{font:600 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#182a49}.small{font:13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#58708e}.tag{font:700 16px Arial,sans-serif;fill:#a4541f}.chip{font:600 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2147ae}
</style>
<rect class="bg" width="780" height="550" rx="20"/>
<text x="40" y="48" font-family="Noto Sans SC, Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183c94">同一个顶部盲槽，三个方向看到的线不同</text>
<text x="40" y="77" class="small">独立自绘教学算例 · 单位 mm · 第一角法（并非教材例 3-14 的原图）</text>
<rect x="40" y="95" width="358" height="175" rx="14" class="panel"/>
<rect x="415" y="95" width="325" height="175" rx="14" class="panel"/>
<rect x="40" y="285" width="358" height="238" rx="14" class="panel"/>
<rect x="415" y="285" width="325" height="238" rx="14" class="panel"/>
<text x="58" y="121" class="label">主视图 V · 从前向后</text>
<text x="433" y="121" class="label">左视图 W · 从左向右</text>
<text x="58" y="310" class="label">俯视图 H · 从上向下</text>
<text x="433" y="313" class="label">读图规则</text>
<!-- front view : width 240, height 120 -->
<path class="edge" d="M100 133 H340 V253 H100 Z"/>
<path class="hidden" d="M178 134 V175 H262 V134"/>
<text x="162" y="160" class="tag">A</text><text x="269" y="160" class="tag">B</text><text x="214" y="195" class="tag">C</text>
<!-- left view : width 150, height 120 -->
<path class="edge" d="M488 133 H638 V253 H488 Z"/>
<path class="hidden" d="M533 134 V175 H593 V134"/>
<text x="519" y="159" class="tag">E</text><text x="601" y="159" class="tag">F</text><text x="560" y="195" class="tag">G</text>
<!-- top view -->
<path class="edge" d="M100 337 H340 V487 H100 Z"/>
<path class="edge" d="M178 382 H262 V442 H178 Z"/>
<text x="211" y="373" class="tag">D</text>
<text x="220" y="417" text-anchor="middle" class="small">槽底可见</text>
<text x="115" y="505" class="small">前</text><text x="115" y="334" class="small">后</text>
<g transform="translate(435 337)">
<path d="M0 0 H26" stroke="#14233e" stroke-width="3"/>
<text x="39" y="5" class="small">可见实体棱 / 轮廓：粗实线</text>
<path d="M0 43 H26" stroke="#ad5d28" stroke-width="2.6" stroke-dasharray="9 6"/>
<text x="39" y="48" class="small">被实体挡住的必要棱：细虚线</text>
<path d="M0 86 H26" stroke="#94a4bd" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="39" y="91" class="small">轻画定位辅助线：不留作最终轮廓</text>
</g>
<text x="435" y="477" class="chip">先俯视找槽口，再投出隐藏的槽壁与槽底</text>
<text x="435" y="501" class="small">主视 A/B/C、左视 E/F/G：隐藏 U 形线</text>
</svg>