<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">左视图上的高度和遮挡必须分别求证</title><desc id="desc">在后段 y=40到80，远侧30高轮廓高于近侧20高台，远侧30线可见；前段 y=0到40，近侧40高台遮挡远侧30线，后者以细虚线示意。</desc>
<rect width="900" height="620" rx="22" fill="#ffffff"/>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#243244}
.tt{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#596b83}.label{font-size:19px;font-weight:600}.small{font-size:17px}.dim{font-size:18px;fill:#536780}
.object{fill:none;stroke:#1f334c;stroke-width:4;stroke-linejoin:round}
.hidden{fill:none;stroke:#c36a35;stroke-width:2.5;stroke-dasharray:10 7}
.helper{fill:none;stroke:#2982b4;stroke-width:1.8;stroke-dasharray:6 6}
.dline{fill:none;stroke:#6a7b91;stroke-width:1.6}
.blue{fill:#167bb1}.orange{fill:#c36a35}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6a7b91"/></marker></defs>

<text x="48" y="48" class="tt">“最高”和“最靠近观察者”是两种判断</text>
<text x="49" y="79" class="sub">左视图 W，第一角法：图纸左侧 = 物体后端，右侧 = 前端</text>
<text x="108" y="134" class="label">后段 y = 80 → 40</text>
<text x="504" y="134" class="label">前段 y = 40 → 0</text>
<path d="M135 402 V232 H390 V168 H670 V402 Z" class="object"/>
<path d="M135 291 H390" class="object"/>
<path d="M135 232 H390" stroke="#167bb1" stroke-width="6"/>
<path d="M390 232 H670" class="hidden"/>
<path d="M390 168 V402" class="helper"/>
<text x="230" y="221" class="small blue">远侧顶部 30（可见）</text>
<text x="433" y="249" class="small orange">远侧顶部 30（被遮挡）</text>
<text x="188" y="315" class="small">近侧顶部 20（可见）</text>
<text x="484" y="157" class="small">近侧高台 40（可见）</text>
<path d="M92 402 V168" class="dline"/>
<path d="M84 402 H98 M84 168 H98" class="dline"/>
<text x="60" y="293" class="dim" transform="rotate(-90 60 293)">高低 z</text>
<text x="135" y="443" class="dim">后端 y=80</text><text x="343" y="443" class="dim">分界 y=40</text>
<text x="590" y="443" class="dim">前端 y=0</text>
<line x1="135" y1="466" x2="670" y2="466" class="dline" marker-end="url(#arrow)"/>
<text x="293" y="496" class="small">纸面向右：越靠物体前端</text>
<path d="M126 540 H216" stroke="#167bb1" stroke-width="5"/><text x="229" y="547" class="small">可见轮廓 / 棱线</text>
<path d="M480 540 H565" class="hidden"/><text x="576" y="547" class="small">需要表达的隐藏棱线</text>
<text x="50" y="595" class="sub">示意依据：近侧后段高20、前段高40；远侧凸台高30且贯穿前后。</text>
</svg>