<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<title id="title">主视图中两条不同棱线的重合投影</title><desc id="desc">上方主视图中的一条可见左边界，来自物体前左棱和后左棱在纸面投影重合；下方俯视图标出两条棱的不同前后位置。</desc>
<rect width="900" height="630" rx="22" fill="#ffffff"/>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#243244}
.tt{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#596b83}.label{font-size:19px;font-weight:600}.small{font-size:17px}.dim{font-size:18px;fill:#536780}
.object{fill:none;stroke:#1f334c;stroke-width:4;stroke-linejoin:round}
.hidden{fill:none;stroke:#c36a35;stroke-width:2.5;stroke-dasharray:10 7}
.helper{fill:none;stroke:#2982b4;stroke-width:1.8;stroke-dasharray:6 6}
.dline{fill:none;stroke:#6a7b91;stroke-width:1.6}
.blue{fill:#167bb1}.orange{fill:#c36a35}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6a7b91"/></marker></defs>

<text x="48" y="50" class="tt">两条空间棱线，为什么只画一条投影线？</text>
<text x="50" y="81" class="sub">教学自拟长方体；第一角法。主视从前向后，俯视从上向下。</text>
<text x="120" y="118" class="label">主视图 V（左右 × 高度）</text>
<rect x="135" y="145" width="300" height="146" class="object"/>
<path d="M135 145 V291" stroke="#167bb1" stroke-width="7"/>
<circle cx="135" cy="215" r="7" fill="#167bb1"/>
<path d="M135 215 H515" class="helper"/>
<text x="525" y="216" class="small">前左 A 与后左 B 的投影完全重合</text>
<text x="525" y="246" class="small">保留可见外轮廓：粗实线</text>
<text x="120" y="347" class="label">俯视图 H（左右 × 前后）</text>
<rect x="135" y="365" width="300" height="155" class="object"/>
<circle cx="135" cy="520" r="8" fill="#167bb1"/>
<circle cx="135" cy="365" r="8" fill="#c36a35"/>
<path d="M125 530 l-30 24" class="helper"/>
<path d="M125 358 l-30 -25" class="helper"/>
<text x="52" y="564" class="small blue">A：前左棱</text>
<text x="52" y="326" class="small orange">B：后左棱</text>
<text x="458" y="389" class="small">后方（y 增大）</text>
<text x="458" y="515" class="small">前方（y 减小）</text>
<text x="458" y="463" class="small">俯视图能区分 A、B 的深度</text>
<text x="51" y="607" class="sub">图线优先：可见粗实线覆盖同位置的隐藏细虚线，不应重复叠画。</text>
</svg>