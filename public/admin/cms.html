<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f6f5">
<title>Firefly · 发表动态</title>
<style>
:root{color-scheme:light;--bg:#f5f6f5;--panel:#fff;--text:#202520;--muted:#8a928c;--line:#e9ece9;--green:#15945a;--soft:#eef7f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.nav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 860px)/2));border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}.back{font-size:13px;color:var(--muted);text-decoration:none;padding:8px 0}.nav-title{font-size:16px;font-weight:750}.publish{border:0;background:var(--green);color:white;border-radius:9px;padding:10px 17px;font-weight:700;font-size:12px;cursor:pointer;opacity:.55}.publish.ready{opacity:1}.main{max-width:760px;margin:28px auto;padding:0 18px}.editor{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 10px 32px #00000005}.hint{font-size:12px;color:var(--muted);margin-bottom:22px}.writing-area{display:flex;gap:15px}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--green);font-weight:850;font-size:18px}.writing{flex:1;min-width:0}.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfcfb;color:var(--text);font:inherit;font-size:13px;outline:none}.field input:focus,.field textarea:focus{border-color:#9bc9ad}.field textarea{min-height:185px;resize:vertical;line-height:1.9}.field input::placeholder,.field textarea::placeholder{color:#a2aaa4}.counter{text-align:right;color:var(--muted);font-size:10px;margin:7px 0 15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.attachments{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 18px}.attach{width:74px;height:74px;border-radius:11px;border:1px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;color:var(--muted);font-size:10px;cursor:pointer}.attach b{font-size:22px;font-weight:400}.photo-tile{width:74px;height:74px;border-radius:11px;background:#e4f1e7;display:grid;place-items:center;overflow:hidden;position:relative}.photo-tile img{width:100%;height:100%;object-fit:cover}.photo-tile button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:#0008;color:#fff;width:20px;height:20px;cursor:pointer}.options{border-top:1px solid var(--line);margin-top:7px}.option{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.option:last-child{border-bottom:0}.option-icon{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:16px}.option-label{font-size:12px}.option-value{margin-left:auto;font-size:11px;color:var(--muted)}.chevron{font-size:19px;color:var(--muted)}.preview-title{margin:25px 3px 11px;font-size:12px;color:var(--muted);font-weight:700}.preview{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:12px}.preview-content{flex:1;min-width:0}.preview-name{font-size:12px;font-weight:750;margin:2px 0 8px}.preview-text{font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.preview-title-text{font-size:15px;font-weight:800;margin-bottom:7px;line-height:1.5}.preview-cover{display:none;max-width:100%;max-height:240px;object-fit:cover;border-radius:9px;margin-top:12px}.preview-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;color:#37724f;background:var(--soft);padding:5px 8px;border-radius:7px}.preview-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:11px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.footnote{font-size:11px;color:var(--muted);line-height:1.8;margin:15px 2px 30px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);opacity:0;transition:.2s;background:#202520;color:white;padding:11px 16px;border-radius:999px;font-size:12px;z-index:9;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.nav{height:56px;padding:0 14px}.main{margin:15px auto;padding:0 10px}.editor{padding:18px 14px;border-radius:14px}.writing-area{gap:10px}.avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px}.field textarea{min-height:190px;font-size:14px}.two{grid-template-columns:1fr 1fr;gap:8px}.option{padding:13px 0}}
</style></head>
<body>
<header class="nav"><a class="back" href="/admin/index.html">‹ 管理首页</a><div class="nav-title">发表动态</div><button class="publish" id="publish" disabled>生成草稿</button></header>
<main class="main">
<section class="editor"><div class="hint">记录此刻，分享你的想法</div><div class="writing-area"><div class="avatar">F</div><div class="writing">
<div class="field"><label for="title">动态标题（文章标题）</label><input id="title" maxlength="120" placeholder="给这次分享起个标题……"></div>
<textarea id="content" maxlength="12000" style="width:100%;min-height:180px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;line-height:1.95;padding:0" placeholder="这一刻的想法……"></textarea><div class="counter"><span id="count">0</span> / 12000</div>
<div class="attachments" id="attachments"><button class="attach" id="addPhoto" type="button"><b>＋</b><span>选择封面</span></button><button class="attach" id="addTopic" type="button"><b>#</b><span>添加话题</span></button><input type="file" id="photoFile" accept="image/*" hidden></div>
<div class="two"><div class="field"><label for="date">发布日期</label><input id="date" type="date"></div><div class="field"><label for="category">分类</label><input id="category" placeholder="技术 / 随笔"></div></div>
<div class="two"><div class="field"><label for="tags">标签</label><input id="tags" placeholder="标签用逗号分隔"></div><div class="field"><label for="description">一句话摘要</label><input id="description" maxlength="220" placeholder="可选摘要"></div></div>
<div class="options"><div class="option" id="visibility"><div class="option-icon">◎</div><div class="option-label">文章状态</div><div class="option-value" id="visibilityValue">草稿</div><div class="chevron">›</div></div><div class="option" id="pinnedRow"><div class="option-icon">⌑</div><div class="option-label">置顶文章</div><div class="option-value" id="pinnedValue">关闭</div><div class="chevron">›</div></div></div>
</div></div></section>
<div class="preview-title">朋友圈效果预览</div><section class="preview"><div class="avatar">F</div><div class="preview-content"><div class="preview-name">Firefly 创作者　·　刚刚</div><div class="preview-title-text" id="previewTitle">你的标题会显示在这里</div><div class="preview-text" id="previewText" style="color:var(--muted)">你写下的内容会实时显示在这里……</div><img class="preview-cover" id="previewCover" alt="封面预览"><div class="preview-tags" id="previewTags"></div><div class="preview-foot"><span id="previewCategory">✦ 公开分享</span><span>♡　评论　↗</span></div></div></section>
<p class="footnote">朋友圈式编辑与预览。点击“生成草稿”会下载符合 Firefly 文章格式的 Markdown 文件。此操作不会直接上传或发布到网站；在线保存与审核发布接口尚未接入。</p>
</main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let coverData="",isDraft=true,isPinned=false;function say(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}function slugify(s){return(s||"untitled").toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"").slice(0,70)||"untitled"}function yaml(s){return '"'+String(s||"").replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g," ")+'"'}function tags(){return $("tags").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)}function update(){const title=$("title").value.trim(),body=$("content").value;$("count").textContent=body.length;$("previewTitle").textContent=title||"你的标题会显示在这里";$("previewText").textContent=body||"你写下的内容会实时显示在这里……";$("previewText").style.color=body?"var(--text)":"var(--muted)";$("previewTags").replaceChildren(...tags().map(t=>{const e=document.createElement("span");e.className="tag";e.textContent="# "+t;return e}));$("previewCategory").textContent=$("category").value.trim()?"✦ "+$("category").value.trim():"✦ 公开分享";$("publish").disabled=!title&&!body.trim();$("publish").classList.toggle("ready",!$("publish").disabled)}["title","content","date","category","tags","description"].forEach(id=>$(id).addEventListener("input",update));$("addPhoto").onclick=()=>$("photoFile").click();$("photoFile").onchange=()=>{const file=$("photoFile").files[0];if(!file)return;if(!file.type.startsWith("image/")){say("请选择图片文件");return}if(file.size>8*1024*1024){say("图片不能超过 8 MB");return}const reader=new FileReader();reader.onload=()=>{coverData=String(reader.result);let tile=document.querySelector(".photo-tile");if(!tile){tile=document.createElement("div");tile.className="photo-tile";$("attachments").insertBefore(tile,$("addPhoto"))}tile.replaceChildren();const img=document.createElement("img");img.src=coverData;tile.append(img);const rm=document.createElement("button");rm.textContent="×";rm.type="button";rm.onclick=()=>{coverData="";tile.remove();$("previewCover").style.display="none";$("photoFile").value=""};tile.append(rm);$("previewCover").src=coverData;$("previewCover").style.display="block";say("封面已加入预览；导出 Markdown 不会嵌入图片文件")};reader.readAsDataURL(file)};$("addTopic").onclick=()=>{const t=prompt("输入话题名称");if(t&&t.trim()){$("content").value+=($("content").value?"\n":"")+"#"+t.trim().replace(/^#/,"")+"#";update();$("content").focus()}};$("visibility").onclick=()=>{isDraft=!isDraft;$("visibilityValue").textContent=isDraft?"草稿":"待审核";say(isDraft?"状态设为草稿":"状态设为待审核（导出后仍需人工提交）")};$("pinnedRow").onclick=()=>{isPinned=!isPinned;$("pinnedValue").textContent=isPinned?"开启":"关闭"};$("publish").onclick=()=>{const title=$("title").value.trim();if(!title){say("请先填写文章标题");$("title").focus();return}const date=$("date").value||new Date().toISOString().slice(0,10),ts=tags(),lines=["---","title: "+yaml(title),"published: "+date,"draft: "+isDraft,"pinned: "+isPinned];if($("description").value.trim())lines.push("description: "+yaml($("description").value.trim()));if(ts.length)lines.push("tags: ["+ts.map(yaml).join(", ")+"]");if($("category").value.trim())lines.push("category: "+yaml($("category").value.trim()));lines.push("---","",$("content").value.trim(),"");const blob=new Blob([lines.join("\n")],{type:"text/markdown;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=slugify(title)+".md";document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);say("Markdown 草稿已生成，请妥善保存")};if(!$("date").value)$("date").value=new Date().toISOString().slice(0,10);update();
</script></body></html>
