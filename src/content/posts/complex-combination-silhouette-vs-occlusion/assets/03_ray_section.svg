<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="第二步：同一高度，前后两段“先看到”的东西不同"><title>第二步：同一高度，前后两段“先看到”的东西不同</title><desc>以下横向代表零件左右位置，竖向代表高度；眼睛从图的左边沿 +x 方向看。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223548;font-size:17px}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#4d6478}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#9aabb8;stroke-width:1.2;stroke-dasharray:13 4 3 4;fill:none}.light{stroke:#acbbc5;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.solid{stroke:#283949;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.edge{stroke:#0f877b;stroke-width:3.1;stroke-linejoin:round;stroke-linecap:round;fill:none}.hidden{stroke:#bb723f;stroke-width:2.5;stroke-dasharray:9 6;fill:none}.aux{stroke:#287bb3;stroke-width:1.7;stroke-dasharray:7 5;fill:none}.near{fill:#d6e9f2;stroke:#3d789b;stroke-width:2}.far{fill:#e6e2f5;stroke:#7162a5;stroke-width:2}.base{fill:#edf1f4;stroke:#586a7a;stroke-width:2}.near2{fill:#b9d9e8;stroke:#3d789b;stroke-width:2}.point{fill:#d97432;stroke:#fff;stroke-width:1.5}.panel{fill:#fff;stroke:#dae4ea;stroke-width:1.3}.label{font-size:16px;font-weight:600}.measure{font-size:15px;fill:#62758a}.wrong{stroke:#c64d47;stroke-width:3.1;fill:none}.ok{stroke:#0f877b;stroke-width:3.1;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text class="head" x="28" y="42">第二步：同一高度，前后两段“先看到”的东西不同</text><text class="sub" x="28.0" y="70.0">以下横向代表零件左右位置，竖向代表高度；眼睛从图的左边沿 +x 方向看。</text><rect class="panel" x="60.0" y="108.0" width="427.0" height="460.0" rx="10.0"/><rect class="base" x="116.0" y="414.0" width="325.0" height="76.0" rx="0.0"/><rect class="near" x="116.0" y="186.0" width="113.8" height="228.0" rx="0.0"/><rect class="far" x="294.8" y="262.0" width="146.2" height="152.0" rx="0.0"/><text class="label" x="86.0" y="137.0">前段 y=20</text><text class="small" x="122.0" y="212.0">近侧 40</text><text class="small" x="304.8" y="287.0">远侧 30</text><line class="aux" x1="77.0" y1="265.8" x2="376.0" y2="265.8"/><path class="aux" d="M365.0,260.8 L376.0,265.8 L365.0,270.8"/><circle class="point" cx="116.0" cy="265.8" r="5.6"/><text class="label" x="124.0" y="255.8">先遇到</text><text class="small" x="86.0" y="542.0">沿同一观察射线比较先碰到谁</text><text class="small" x="86.0" y="593.0">前段：近侧40挡住远侧30</text><rect class="panel" x="523.0" y="108.0" width="427.0" height="460.0" rx="10.0"/><rect class="base" x="579.0" y="414.0" width="325.0" height="76.0" rx="0.0"/><rect class="near2" x="579.0" y="338.0" width="113.8" height="76.0" rx="0.0"/><rect class="far" x="757.8" y="262.0" width="146.2" height="152.0" rx="0.0"/><text class="label" x="549.0" y="137.0">后段 y=60</text><text class="small" x="585.0" y="364.0">近侧 20</text><text class="small" x="767.8" y="287.0">远侧 30</text><line class="aux" x1="540.0" y1="265.8" x2="839.0" y2="265.8"/><path class="aux" d="M828.0,260.8 L839.0,265.8 L828.0,270.8"/><circle class="point" cx="757.8" cy="265.8" r="5.6"/><text class="label" x="765.8" y="255.8">先遇到</text><text class="small" x="549.0" y="542.0">沿同一观察射线比较先碰到谁</text><text class="small" x="549.0" y="593.0">后段：近侧只有20，远侧30露出</text><text class="sub" x="48.0" y="625.0">注意：这里先证明一条观察射线的遮挡，不是只比较两块实体谁更高。</text></svg>