<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-label="第五步：为什么同一深度的两个左视点上下对正？"><title>第五步：为什么同一深度的两个左视点上下对正？</title><desc>边界深度 y=40；两条真实棱分别来自近侧高台和远侧凸台。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223548;font-size:17px}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#4d6478}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#9aabb8;stroke-width:1.2;stroke-dasharray:13 4 3 4;fill:none}.light{stroke:#acbbc5;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.solid{stroke:#283949;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.edge{stroke:#0f877b;stroke-width:3.1;stroke-linejoin:round;stroke-linecap:round;fill:none}.hidden{stroke:#bb723f;stroke-width:2.5;stroke-dasharray:9 6;fill:none}.aux{stroke:#287bb3;stroke-width:1.7;stroke-dasharray:7 5;fill:none}.near{fill:#d6e9f2;stroke:#3d789b;stroke-width:2}.far{fill:#e6e2f5;stroke:#7162a5;stroke-width:2}.base{fill:#edf1f4;stroke:#586a7a;stroke-width:2}.near2{fill:#b9d9e8;stroke:#3d789b;stroke-width:2}.point{fill:#d97432;stroke:#fff;stroke-width:1.5}.panel{fill:#fff;stroke:#dae4ea;stroke-width:1.3}.label{font-size:16px;font-weight:600}.measure{font-size:15px;fill:#62758a}.wrong{stroke:#c64d47;stroke-width:3.1;fill:none}.ok{stroke:#0f877b;stroke-width:3.1;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text class="head" x="28" y="42">第五步：为什么同一深度的两个左视点上下对正？</text><text class="sub" x="28.0" y="70.0">边界深度 y=40；两条真实棱分别来自近侧高台和远侧凸台。</text><rect class="panel" x="45.0" y="97.0" width="446.0" height="219.0" rx="12.0"/><rect class="panel" x="45.0" y="343.0" width="446.0" height="274.0" rx="12.0"/><rect class="panel" x="517.0" y="97.0" width="453.0" height="219.0" rx="12.0"/><rect class="panel" x="517.0" y="343.0" width="453.0" height="274.0" rx="12.0"/><text class="label" x="67.0" y="126.0">主视 V：分别提供高度</text><text class="label" x="67.0" y="372.0">俯视 H：两个点同深度</text><text class="label" x="539.0" y="126.0">左视 W：同深度，同左右位置</text><text class="label" x="539.0" y="372.0">右下45°线：只转移深度</text><path class="solid" d="M100.0,295.0 L320.0,295.0 L320.0,205.0 L221.0,205.0 L221.0,265.0 L177.0,265.0 L177.0,175.0 L100.0,175.0 L100.0,295.0"/><path class="solid" d="M100.0,575.0 L320.0,575.0 L320.0,415.0 L100.0,415.0 L100.0,575.0"/><line class="solid" x1="177.0" y1="575.0" x2="177.0" y2="415.0"/><line class="solid" x1="221.0" y1="575.0" x2="221.0" y2="415.0"/><line class="solid" x1="100.0" y1="495.0" x2="177.0" y2="495.0"/><line class="aux" x1="630.0" y1="415.0" x2="790.0" y2="575.0"/><text class="small" x="713.0" y="579.0">45°</text><line class="aux" x1="100.0" y1="175.0" x2="710.0" y2="175.0"/><line class="aux" x1="100.0" y1="495.0" x2="710.0" y2="495.0"/><line class="aux" x1="710.0" y1="495.0" x2="710.0" y2="175.0"/><circle class="point" cx="100.0" cy="175.0" r="5.6"/><text class="label" x="107.0" y="166.0">N(V)</text><circle class="point" cx="100.0" cy="495.0" r="5.6"/><text class="label" x="107.0" y="485.0">N(H)</text><circle class="point" cx="710.0" cy="175.0" r="5.6"/><text class="label" x="718.0" y="167.0">N(W)</text><line class="aux" x1="221.0" y1="205.0" x2="710.0" y2="205.0"/><line class="aux" x1="221.0" y1="495.0" x2="710.0" y2="495.0"/><line class="aux" x1="710.0" y1="495.0" x2="710.0" y2="205.0"/><circle class="point" cx="221.0" cy="205.0" r="5.6"/><text class="label" x="228.0" y="196.0">F(V)</text><circle class="point" cx="221.0" cy="495.0" r="5.6"/><text class="label" x="228.0" y="485.0">F(H)</text><circle class="point" cx="710.0" cy="205.0" r="5.6"/><text class="label" x="718.0" y="197.0">F(W)</text><text class="small" x="547.0" y="602.0">N：近侧高台最高40</text><text class="small" x="765.0" y="602.0">F：远侧台阶最高30</text><text class="sub" x="45.0" y="650.0">两点同深度，却有不同高度；它们的左视点同竖线排列，绝不是随意决定上下位置。</text></svg>