<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="常见错误对照：把“最高”和“最近”混为一谈"><title>常见错误对照：把“最高”和“最近”混为一谈</title><desc>不要先描实线：先核对前后分界、高度来源和真实遮挡。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223548;font-size:17px}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#4d6478}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#9aabb8;stroke-width:1.2;stroke-dasharray:13 4 3 4;fill:none}.light{stroke:#acbbc5;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.solid{stroke:#283949;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.edge{stroke:#0f877b;stroke-width:3.1;stroke-linejoin:round;stroke-linecap:round;fill:none}.hidden{stroke:#bb723f;stroke-width:2.5;stroke-dasharray:9 6;fill:none}.aux{stroke:#287bb3;stroke-width:1.7;stroke-dasharray:7 5;fill:none}.near{fill:#d6e9f2;stroke:#3d789b;stroke-width:2}.far{fill:#e6e2f5;stroke:#7162a5;stroke-width:2}.base{fill:#edf1f4;stroke:#586a7a;stroke-width:2}.near2{fill:#b9d9e8;stroke:#3d789b;stroke-width:2}.point{fill:#d97432;stroke:#fff;stroke-width:1.5}.panel{fill:#fff;stroke:#dae4ea;stroke-width:1.3}.label{font-size:16px;font-weight:600}.measure{font-size:15px;fill:#62758a}.wrong{stroke:#c64d47;stroke-width:3.1;fill:none}.ok{stroke:#0f877b;stroke-width:3.1;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text class="head" x="28" y="42">常见错误对照：把“最高”和“最近”混为一谈</text><text class="sub" x="28.0" y="70.0">不要先描实线：先核对前后分界、高度来源和真实遮挡。</text><rect class="panel" x="50.0" y="104.0" width="423.0" height="472.0" rx="12.0"/><text class="label" x="70.0" y="138.0">错误：把近侧高度40贯穿前后</text><path class="wrong" d="M105.0,508.0 L410.0,508.0 L410.0,188.0 L105.0,188.0 L105.0,508.0"/><line class="light" x1="265.0" y1="508.0" x2="265.0" y2="160.0"/><text class="small" x="105.0" y="544.0">后方</text><text class="small" x="380.0" y="544.0">前方</text><text class="small" x="84.0" y="597.0">错误原因：没按前后区间找实体</text><rect class="panel" x="516.0" y="104.0" width="423.0" height="472.0" rx="12.0"/><text class="label" x="536.0" y="138.0">正确：后段30、前段40</text><path class="ok" d="M571.0,508.0 L876.0,508.0 L876.0,188.0 L731.0,188.0 L731.0,268.0 L571.0,268.0 L571.0,508.0"/><line class="light" x1="731.0" y1="508.0" x2="731.0" y2="160.0"/><text class="small" x="571.0" y="544.0">后方</text><text class="small" x="846.0" y="544.0">前方</text><text class="small" x="550.0" y="597.0">验证：后段远30高于近20；前段近40</text></svg>