<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-label="第一步：先找前后分界，再问每一段有哪些实体"><title>第一步：先找前后分界，再问每一段有哪些实体</title><desc>俯视图只告诉占地范围：高度必须回到主视图或题设结构取得。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223548;font-size:17px}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#4d6478}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#9aabb8;stroke-width:1.2;stroke-dasharray:13 4 3 4;fill:none}.light{stroke:#acbbc5;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.solid{stroke:#283949;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.edge{stroke:#0f877b;stroke-width:3.1;stroke-linejoin:round;stroke-linecap:round;fill:none}.hidden{stroke:#bb723f;stroke-width:2.5;stroke-dasharray:9 6;fill:none}.aux{stroke:#287bb3;stroke-width:1.7;stroke-dasharray:7 5;fill:none}.near{fill:#d6e9f2;stroke:#3d789b;stroke-width:2}.far{fill:#e6e2f5;stroke:#7162a5;stroke-width:2}.base{fill:#edf1f4;stroke:#586a7a;stroke-width:2}.near2{fill:#b9d9e8;stroke:#3d789b;stroke-width:2}.point{fill:#d97432;stroke:#fff;stroke-width:1.5}.panel{fill:#fff;stroke:#dae4ea;stroke-width:1.3}.label{font-size:16px;font-weight:600}.measure{font-size:15px;fill:#62758a}.wrong{stroke:#c64d47;stroke-width:3.1;fill:none}.ok{stroke:#0f877b;stroke-width:3.1;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text class="head" x="28" y="42">第一步：先找前后分界，再问每一段有哪些实体</text><text class="sub" x="28.0" y="70.0">俯视图只告诉占地范围：高度必须回到主视图或题设结构取得。</text><rect class="panel" x="40.0" y="95.0" width="530.0" height="490.0" rx="12.0"/><rect class="panel" x="605.0" y="95.0" width="351.0" height="490.0" rx="12.0"/><rect class="base" x="130.0" y="153.0" width="440.0" height="352.0" rx="0.0"/><rect class="near" x="130.0" y="329.0" width="154.0" height="176.0" rx="0.0"/><rect class="near2" x="130.0" y="153.0" width="154.0" height="176.0" rx="0.0"/><rect class="far" x="372.0" y="153.0" width="198.0" height="352.0" rx="0.0"/><line class="aux" x1="100.0" y1="329.0" x2="598.0" y2="329.0"/><text class="small" x="102.0" y="321.0">后段 ↑</text><text class="small" x="102.0" y="351.0">前段 ↓</text><text class="small" x="187.2" y="417.0">近高台 40</text><text class="small" x="187.2" y="241.0">近低台 20</text><text class="small" x="402.8" y="417.0">远侧 30</text><text class="small" x="402.8" y="241.0">远侧 30</text><text class="label" x="625.0" y="137.0">方位约定</text><text class="small" x="625.0" y="173.0">纸面上方：后方（y大）</text><text class="small" x="625.0" y="206.0">纸面下方：前方（y小）</text><text class="label" x="625.0" y="252.0">从左侧观察：</text><text class="small" x="625.0" y="290.0">先遇到左侧的凸台，</text><text class="small" x="625.0" y="319.0">再遇到右侧的凸台。</text><text class="label" x="625.0" y="378.0">y=40 是关键分界</text><text class="small" x="625.0" y="416.0">因为近侧凸台在这里</text><text class="small" x="625.0" y="446.0">由40高变为20高。</text><text class="small" x="625.0" y="515.0">远侧凸台则一直高30。</text><text class="sub" x="75.0" y="603.0">浅蓝＝近左侧高台；深蓝＝近左侧低台；淡紫＝远右侧凸台；灰＝底座。</text></svg>