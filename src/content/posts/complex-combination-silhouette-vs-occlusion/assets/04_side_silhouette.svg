<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" role="img" aria-label="第三步：左视外轮廓由“每段最高材料”决定"><title>第三步：左视外轮廓由“每段最高材料”决定</title><desc>W 左视图：纸面左边是后方，右边是前方；从左侧观察零件。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223548;font-size:17px}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#4d6478}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#9aabb8;stroke-width:1.2;stroke-dasharray:13 4 3 4;fill:none}.light{stroke:#acbbc5;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.solid{stroke:#283949;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.edge{stroke:#0f877b;stroke-width:3.1;stroke-linejoin:round;stroke-linecap:round;fill:none}.hidden{stroke:#bb723f;stroke-width:2.5;stroke-dasharray:9 6;fill:none}.aux{stroke:#287bb3;stroke-width:1.7;stroke-dasharray:7 5;fill:none}.near{fill:#d6e9f2;stroke:#3d789b;stroke-width:2}.far{fill:#e6e2f5;stroke:#7162a5;stroke-width:2}.base{fill:#edf1f4;stroke:#586a7a;stroke-width:2}.near2{fill:#b9d9e8;stroke:#3d789b;stroke-width:2}.point{fill:#d97432;stroke:#fff;stroke-width:1.5}.panel{fill:#fff;stroke:#dae4ea;stroke-width:1.3}.label{font-size:16px;font-weight:600}.measure{font-size:15px;fill:#62758a}.wrong{stroke:#c64d47;stroke-width:3.1;fill:none}.ok{stroke:#0f877b;stroke-width:3.1;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text class="head" x="28" y="42">第三步：左视外轮廓由“每段最高材料”决定</text><text class="sub" x="28.0" y="70.0">W 左视图：纸面左边是后方，右边是前方；从左侧观察零件。</text><rect class="panel" x="45.0" y="102.0" width="603.0" height="453.0" rx="12.0"/><rect class="panel" x="672.0" y="102.0" width="284.0" height="453.0" rx="12.0"/><line class="light" x1="122.0" y1="415.0" x2="578.0" y2="415.0"/><text class="measure" x="82.0" y="420.0">10</text><line class="light" x1="122.0" y1="335.0" x2="578.0" y2="335.0"/><text class="measure" x="82.0" y="340.0">20</text><line class="light" x1="122.0" y1="255.0" x2="578.0" y2="255.0"/><text class="measure" x="82.0" y="260.0">30</text><line class="light" x1="122.0" y1="175.0" x2="578.0" y2="175.0"/><text class="measure" x="82.0" y="180.0">40</text><line class="aux" x1="350.0" y1="120.0" x2="350.0" y2="515.0"/><path class="edge" d="M150.0,495.0 L550.0,495.0 L550.0,175.0 L350.0,175.0 L350.0,255.0 L150.0,255.0 L150.0,495.0"/><circle class="point" cx="150.0" cy="255.0" r="5.6"/><text class="label" x="157.0" y="244.0">A</text><circle class="point" cx="350.0" cy="255.0" r="5.6"/><text class="label" x="357.0" y="244.0">B</text><circle class="point" cx="350.0" cy="175.0" r="5.6"/><text class="label" x="357.0" y="164.0">C</text><circle class="point" cx="550.0" cy="175.0" r="5.6"/><text class="label" x="557.0" y="164.0">D</text><text class="label" x="150.0" y="546.0">后</text><text class="label" x="550.0" y="546.0">前</text><text class="small" x="350.0" y="567.0" text-anchor="middle">分界 y=40</text><text class="label" x="691.0" y="151.0">为什么 A—B 高30？</text><text class="small" x="691.0" y="192.0">后段远侧台阶高30，</text><text class="small" x="691.0" y="219.0">近侧台阶只有20。</text><text class="label" x="691.0" y="275.0">为什么 C—D 高40？</text><text class="small" x="691.0" y="316.0">前段近侧高台达40。</text><text class="label" x="691.0" y="371.0">为什么 B—C 竖直？</text><text class="small" x="691.0" y="408.0">前后分界在同一深度；</text><text class="small" x="691.0" y="435.0">轮廓由30变为40。</text><text class="sub" x="48.0" y="592.0">只画外轮廓，不代表已经完成内部棱线与虚线。</text></svg>