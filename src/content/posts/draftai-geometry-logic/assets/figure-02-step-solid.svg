<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="图2｜复杂台阶体的侧视图轮廓证明"><rect width="760" height="440" rx="22" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#15304b;font-size:17px}.note{font-size:14px;fill:#53718c}.heading{font-size:21px;font-weight:700}.main{stroke:#172b4d;stroke-width:3;fill:none}.guide{stroke:#9ab1c5;stroke-width:1.8;stroke-dasharray:6 5;fill:none}.accent{stroke:#147ab7;stroke-width:3;fill:none}.pt{fill:#e27738;stroke:#fff;stroke-width:1.2}</style><text class="heading" x="28" y="36">图2｜复杂台阶体的侧视图轮廓证明</text><text x="35" y="78">已知实体：底座 0–12；左侧高台 12–26</text><text x="35" y="106">后段高台 12–34；前段低台 12–18</text><rect x="42" y="139" width="260" height="251" rx="8" fill="white" stroke="#bfd0dc"/><text x="55" y="163">空间高度与深度区间</text><line class="guide" x1="76" y1="349" x2="280" y2="349"/><rect x="80" y="279" width="192" height="70" fill="#b4d9ee" stroke="#146d9b"/><rect x="80" y="211" width="115" height="68" fill="#73add2" stroke="#146d9b"/><rect x="195" y="179" width="77" height="100" fill="#a7bbef" stroke="#146d9b"/><text class="note" x="101" y="236">z=26</text><text class="note" x="208" y="194">z=34</text><text class="note" x="90" y="325">底座</text><rect x="329" y="139" width="396" height="251" rx="8" fill="white" stroke="#bfd0dc"/><text x="346" y="163">左视图：水平为深度 y，竖直为高度 z</text><polyline points="370,354 674,354 674,194 552,194 552,232 370,232 370,354" fill="#eff8ff" stroke="#17395f" stroke-width="3"/><line class="accent" x1="552" y1="232" x2="674" y2="232"/><line x1="370" y1="275" x2="552" y2="275" stroke="#ad6e58" stroke-width="3" stroke-dasharray="9 5"/><line class="guide" x1="552" y1="185" x2="552" y2="364"/><text x="376" y="218">26</text><text x="643" y="184">34</text><text x="379" y="267">18（遮挡）</text><text class="note" x="370" y="379">y=0</text><text class="note" x="540" y="379">y=24</text><text class="note" x="652" y="379">y=40</text><text class="note" x="368" y="416">线型必须考虑 x 方向的遮挡关系，而非只看 y/z</text></svg>