<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-label="教材 3-6-3 / 3-6-7：一个点必须满足两条来源"><rect width="900" height="510" fill="#f7fafc" rx="18"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1a3654;font-size:20px}.head{font-size:25px;font-weight:bold}.hint{font-size:16px;fill:#526b80}.paper{fill:#fff;stroke:#bfd3e0;stroke-width:2}.solid{stroke:#294768;stroke-width:3;fill:none}.guide{stroke:#91adc4;stroke-width:2;stroke-dasharray:8 6;fill:none}.blue{stroke:#2176b4;stroke-width:3;fill:none}.orange{stroke:#eb803b;stroke-width:3;fill:none}.point{fill:#eb803b;stroke:#fff;stroke-width:2}</style><text class="head" x="28" y="43">教材 3-6-3 / 3-6-7：一个点必须满足两条来源</text>
<rect class="paper" x="29" y="73" width="420" height="401" rx="11"/><rect class="paper" x="469" y="73" width="399" height="401" rx="11"/>
<text x="48" y="112">主视：先选高度，再找斜截线上的点</text>
<path class="solid" d="M82 283 L240 130 L399 283 Z"/><path class="orange" d="M141 240 L316 183"/>
<path class="guide" d="M82 214 H400"/><circle class="point" cx="220" cy="214" r="8"/>
<text class="hint" x="51" y="330">1. 水平辅助线穿过截线</text><text class="hint" x="51" y="362">2. 同高度圆锥横截面是圆</text><text class="hint" x="51" y="394">3. 圆周和投射线共同确定点</text>
<text x="493" y="112">俯视：辅助圆 ∩ 同名点投影线</text>
<circle cx="667" cy="271" r="115" fill="none" stroke="#2176b4" stroke-width="3"/>
<line class="guide" x1="645" y1="141" x2="645" y2="401"/>
<circle class="point" cx="645" cy="158" r="7"/><circle class="point" cx="645" cy="384" r="7"/>
<text class="hint" x="691" y="160">前侧候选点</text><text class="hint" x="691" y="384">后侧候选点</text>
<text class="hint" x="491" y="448">一次可能得到两个点：不能只取一个。</text></svg>