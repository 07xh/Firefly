<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="图4｜为什么某条圆锥母线投到主视中心线"><rect width="760" height="440" rx="22" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#15304b;font-size:17px}.note{font-size:14px;fill:#53718c}.heading{font-size:21px;font-weight:700}.main{stroke:#172b4d;stroke-width:3;fill:none}.guide{stroke:#9ab1c5;stroke-width:1.8;stroke-dasharray:6 5;fill:none}.accent{stroke:#147ab7;stroke-width:3;fill:none}.pt{fill:#e27738;stroke:#fff;stroke-width:1.2}</style><text class="heading" x="28" y="36">图4｜为什么某条圆锥母线投到主视中心线</text><rect x="32" y="74" width="336" height="295" rx="9" fill="white" stroke="#c7d7e2"/><rect x="392" y="74" width="336" height="295" rx="9" fill="white" stroke="#c7d7e2"/><text x="56" y="112">主视图：只保留 (x,z)</text><text x="417" y="112">俯视图：只保留 (x,y)</text><path d="M87 327 L199 134 L311 327 Z" stroke="#1b507a" stroke-width="3" fill="#eaf6fc"/><line class="guide" x1="199" y1="128" x2="199" y2="340"/><line x1="199" y1="134" x2="199" y2="327" stroke="#e27738" stroke-width="5"/><circle class="pt" cx="199" cy="234" r="6"/><text x="214" y="233">x=0，投影重合</text><text class="note" x="56" y="353">母线：O(0,0,40) → B(0,20,0)</text><circle cx="560" cy="235" r="104" fill="#eaf6fc" stroke="#1b507a" stroke-width="3"/><line class="guide" x1="456" y1="235" x2="664" y2="235"/><line class="guide" x1="560" y1="130" x2="560" y2="338"/><line x1="560" y1="235" x2="560" y2="131" stroke="#e27738" stroke-width="4"/><circle class="pt" cx="560" cy="183" r="6"/><text x="576" y="190">Mₕ=(0,10)</text><text class="note" x="416" y="351">在俯视图中它并不与中心重合</text><text class="note" x="37" y="408">不是所有母线都会投在中心线；必须看该母线上点的 x 坐标是否恒为 0</text></svg>