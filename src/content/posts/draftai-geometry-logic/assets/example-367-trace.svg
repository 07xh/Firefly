<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-label="3-6-7：先连续求点，观察转折，再识别曲线"><rect width="900" height="510" rx="24" fill="#f7fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#16344f;font-size:18px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:16px;fill:#57718b}.panel{fill:#fff;stroke:#c9d8e5;stroke-width:2}.edge{stroke:#203c58;stroke-width:3;fill:none}.fine{stroke:#86a6bd;stroke-width:1.9;stroke-dasharray:7 5;fill:none}.work{stroke:#1c83ac;stroke-width:3;fill:none}.result{stroke:#0c8a77;stroke-width:4;fill:none}.point{fill:#f28b43;stroke:#fff;stroke-width:2}</style><text class="title" x="30" y="42">3-6-7：先连续求点，观察转折，再识别曲线</text>
<rect class="panel" x="25" y="70" width="264" height="382" rx="12"/><rect class="panel" x="316" y="70" width="264" height="382" rx="12"/><rect class="panel" x="607" y="70" width="267" height="382" rx="12"/>
<text x="42" y="105">① 看清截平面方向</text><path class="edge" d="M64 326 L170 148 L263 326"/><path class="fine" d="M170 137 V342"/><line stroke="#e37e4e" stroke-width="4" x1="77" y1="325" x2="174" y2="162"/><path class="work" d="M110 348 L207 185"/><text class="subtitle" x="47" y="394">与一条母线方向平行</text><text class="subtitle" x="47" y="417">先记条件，不画结论</text>
<text x="334" y="105">② 同高度辅助圆求点</text><circle class="work" cx="450" cy="269" r="97"/><path class="fine" d="M450 155 V382 M341 269 H559"/><path class="fine" d="M503 169 V366"/><circle class="point" cx="503" cy="187.8" r="7"/><circle class="point" cx="503" cy="350.2" r="7"/>
<text class="subtitle" x="330" y="394">先找到前、后两个点</text><text class="subtitle" x="330" y="417">再换高度重复</text>
<text x="624" y="105">③ 点列指向同一转折处</text>
<path class="result" d="M650 178 Q846 266 650 354"/><circle class="point" cx="650" cy="178" r="7"/><circle class="point" cx="759" cy="234" r="7"/><circle class="point" cx="796" cy="266" r="7"/><circle class="point" cx="759" cy="298" r="7"/><circle class="point" cx="650" cy="354" r="7"/>
<text class="subtitle" x="623" y="394">转折点不等于圆锥尖顶</text><text class="subtitle" x="623" y="417">名称留到求完点以后</text>
<text class="subtitle" x="27" y="484">示意中的曲线只是“连续点列”的画法提示，不是原题截交线尺寸或最终线型。</text></svg>