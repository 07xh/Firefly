<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-label="教学组合体第一角法示意"><rect width="1080" height="760" fill="#fff"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263845;font-size:17px}.head{font-size:26px;font-weight:650}.note{font-size:15px;fill:#596d7b}.panel{fill:white;stroke:#dce5eb;stroke-width:1.1}.obj{stroke:#202d36;stroke-width:2.7;fill:none}.new{stroke:#007b6e;stroke-width:3.1;fill:none}.guide{stroke:#9aaab6;stroke-width:1.25;stroke-dasharray:5 4;fill:none}.aux{stroke:#397faf;stroke-width:1.5;stroke-dasharray:6 5;fill:none}.trans{stroke:#5a86aa;stroke-width:1.7;stroke-dasharray:12 4;fill:none}</style><text class="head" x="30" y="43">复杂补第三视图｜第1图 读取主俯条件</text><text class="note" x="30" y="71">独立建模的前后错层组合体，不等同于任一教材原题；用来证明转折点由两个视图共同确定</text><rect class="panel" x="40" y="89" width="470" height="339" rx="12"/><rect class="panel" x="40" y="453" width="470" height="260" rx="12"/><rect class="panel" x="533" y="89" width="506" height="339" rx="12"/><rect class="panel" x="533" y="453" width="506" height="260" rx="12"/><text x="62" y="118">V 主视图</text><text x="62" y="482">H 俯视图</text><text x="554" y="118">W 左视图（待补）</text><text x="554" y="482">45°转移线区域</text><path class="obj" d="M219.5 345.6 L219.5 270.9 L288.5 270.9 L288.5 247.8 L380.5 247.8 L380.5 345.6 Z"/><path class="obj" d="M219.5 528.5 L380.5 528.5 L380.5 643.5 L219.5 643.5 Z"/><line class="obj" x1="288.5" y1="528.5" x2="288.5" y2="643.5"/><line class="obj" x1="288.5" y1="586.0" x2="380.5" y2="586.0"/><line class="guide" x1="219.5" y1="322.6" x2="380.5" y2="322.6"/><line class="guide" x1="219.5" y1="299.6" x2="380.5" y2="299.6"/><line class="guide" x1="219.5" y1="270.9" x2="380.5" y2="270.9"/><line class="guide" x1="219.5" y1="247.8" x2="380.5" y2="247.8"/><text x="562" y="535" class="note">左视图未知：先不要描外框</text><text x="562" y="560" class="note">从俯视读出前、后两个区间</text><text x="562" y="585" class="note">从主视读出65与85两种高度</text><text x="37" y="747" class="note">黑色：已知轮廓　蓝色：构造线　青色：由条件推出的轮廓；是否有内部可见边仍要另查遮挡</text></svg>