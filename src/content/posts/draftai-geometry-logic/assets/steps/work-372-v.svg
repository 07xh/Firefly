<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="教材 3-7-2｜V形底点不能凭对称猜高度"><rect width="1000" height="490" fill="white"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#253746;font-size:19px}.head{font-size:26px;font-weight:650}.label{font-size:16px;fill:#b96024}.sub{font-size:17px;fill:#5d7383}.panel{fill:#fff;stroke:#e0e7ec;stroke-width:1.3}.obj{stroke:#1f2b34;stroke-width:2.6;fill:none}.new{stroke:#007b70;stroke-width:3.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.aux{stroke:#317cb2;stroke-width:1.5;stroke-dasharray:6 4;fill:none}.axis{stroke:#9aabb6;stroke-width:1.25;stroke-dasharray:14 4 3 4;fill:none}.dot{fill:#e78739;stroke:#fff;stroke-width:1.2}</style><text class="head" x="28" y="44">教材 3-7-2｜V形底点不能凭对称猜高度</text><text class="sub" x="28" y="75">主视局部结构；示意 V 形简化与“真实交线”不是一回事</text><rect class="panel" x="28" y="96" width="640" height="327" rx="10"/><rect class="panel" x="686" y="96" width="287" height="327" rx="10"/><path class="obj" d="M182 170 H545 M182 170 V342 H545 V170"/><line class="axis" x1="365.0" y1="128.0" x2="365.0" y2="360.0"/><path class="new" d="M248 170 L365 311 L482 170"/><circle class="dot" cx="248.0" cy="170.0" r="5.3"/><text class="label" x="257.0" y="160.0">A</text><circle class="dot" cx="482.0" cy="170.0" r="5.3"/><text class="label" x="491.0" y="160.0">B</text><circle class="dot" cx="365.0" cy="311.0" r="5.3"/><text class="label" x="374.0" y="301.0">C</text><text x="706" y="184">① 两肩是 A、B</text><text x="706" y="230">② C 在对称中心线</text><text x="706" y="276">③ C 的高低还需题设</text><text x="706" y="322">④ V 形是规定简化</text><text class="sub" x="705" y="136">对称仅确定左右位置</text><text class="sub" x="28" y="465">黑：实体线　青：本步新线　蓝色细虚线：构造　橙：待证明的点；真实题目的线型另按遮挡核验</text></svg>