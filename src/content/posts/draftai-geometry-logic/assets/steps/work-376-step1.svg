1="570.0" x2="410.0" y2="570.0"/><line class="axis" x1="300.0" y1="463.0" x2="300.0" y2="677.0"/><line class="axis" x1="753.0" y1="171.0" x2="753.0" y2="345.0"/><line class="axis" x1="666.0" y1="258.0" x2="840.0" y2="258.0"/><circle class="dot" cx="208.0" cy="327.0" r="5.5"/><text class="ptlabel" x="216.0" y="318.0">A</text><circle class="dot" cx="208.0" cy="189.0" r="5.5"/><text class="ptlabel" x="216.0" y="180.0">B</text><circle class="dot" cx="239.1" cy="258.0" r="5.5"/><text class="ptlabel" x="247.1" y="249.0">M</text><text x="558" y="528" class="note">A、B 由实际相交范围确定；</text><text x="558" y="560" class="note">M 是两圆柱共同点列中的极值。</text><text x="558" y="590" class="note">不能先画一条“像答案”的弧。</text><text class="note" x="40" y="747">黑色：实体轮廓　蓝色虚线：构造辅助　橙点：同名点　青线：本步求得交线投影（最终实虚须另核验）</text></svg>