<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-label="第一角法三视图同名点准确转移示意"><rect width="1080" height="760" fill="#fff"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#283944;font-size:18px}.title{font-size:26px;font-weight:650}.note{font-size:16px;fill:#596f7d}.panel{fill:white;stroke:#dce5eb;stroke-width:1.2}.obj{fill:none;stroke:#263544;stroke-width:2.5}.aux{fill:none;stroke:#2879ac;stroke-width:1.6;stroke-dasharray:7 5}.axis{fill:none;stroke:#8799a8;stroke-width:1.3;stroke-dasharray:14 4 3 4}.transfer{fill:none;stroke:#26628a;stroke-width:1.8;stroke-dasharray:13 5}.point{fill:#e18736;stroke:white;stroke-width:1.5}.label{fill:#b15b22;font-size:18px}</style><text class="title" x="28" y="44">基本功：左视点由“主视高度 + 俯视深度”共同确定</text><text class="note" x="28" y="74">第一角法：V 左上、H 左下、W 右上；右下45°线方向为左上→右下</text><rect class="panel" x="40" y="92" width="470" height="335" rx="12"/><rect class="panel" x="40" y="453" width="470" height="257" rx="12"/><rect class="panel" x="533" y="92" width="506" height="335" rx="12"/><rect class="panel" x="533" y="453" width="506" height="257" rx="12"/><text x="62" y="123">V 主视图：左右 + 高低</text><text x="62" y="482">H 俯视图：左右 + 前后</text><text x="557" y="123">W 左视图：前后 + 高低</text><text x="556" y="482">45°线只传前后深度</text><line class="axis" x1="300" y1="176" x2="300" y2="392"/><line class="axis" x1="220" y1="258" x2="430" y2="258"/><line class="axis" x1="300" y1="494" x2="300" y2="685"/><line class="axis" x1="200" y1="570" x2="415" y2="570"/><line class="axis" x1="753" y1="174" x2="753" y2="399"/><line class="axis" x1="650" y1="258" x2="863" y2="258"/><path class="transfer" d="M650 467 L862 679"/><line class="aux" x1="328.75" y1="275.25" x2="793.25" y2="275.25"/><line class="aux" x1="328.75" y1="275.25" x2="328.75" y2="610.25"/><line class="aux" x1="328.75" y1="610.25" x2="793.25" y2="610.25"/><line class="aux" x1="793.25" y1="610.25" x2="793.25" y2="275.25"/><circle class="point" cx="328.75" cy="275.25" r="6"/><circle class="point" cx="328.75" cy="610.25" r="6"/><circle class="point" cx="793.25" cy="275.25" r="6"/><circle class="point" cx="793.25" cy="610.25" r="5"/><text class="label" x="338.75" y="265.25">Pᵥ</text><text class="label" x="338.75" y="600.25">Pₕ</text><text class="label" x="803.25" y="265.25">P𝓌</text><text class="note" x="570" y="691">转移交点 K 与 Pₕ 等深</text><text class="note" x="40" y="744">检查：V、W 高平齐；V、H 左右对正；H 的前后距离经45°线转为 W 的水平距离。</text></svg>