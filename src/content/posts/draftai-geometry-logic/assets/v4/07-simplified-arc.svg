<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="简化相贯：为什么不能给两个端点就画圆？"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:24px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.lab{font-size:15px;fill:#ad6020}.outline{fill:none;stroke:#1e2b35;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.guide{fill:none;stroke:#a7b2bc;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.7;stroke-dasharray:6 4}.axis{fill:none;stroke:#8798a6;stroke-width:1.2;stroke-dasharray:13 4 2 4}.result{fill:none;stroke:#13867b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hi{stroke:#c57942;stroke-width:2;fill:none}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.near{stroke:#243747;fill:#dcecf3;stroke-width:2.2}.far{stroke:#899da9;fill:#e5e7eb;stroke-width:1.7}</style><text x="28" y="40" class="title">简化相贯：为什么不能给两个端点就画圆？</text><text x="28" y="67" class="mini">独立构造：端点＋给定半径＋凹向，才能唯一确定示例圆弧。</text><rect class="panel" x="46" y="86" width="415" height="536" rx="10"/><rect class="panel" x="485" y="86" width="395" height="536" rx="10"/><text x="65" y="116" class="txt">教材允许简化作圆弧时，先查半径</text><text x="510" y="116" class="txt">为什么两端点还不够？</text><line x1="165.00" y1="315.00" x2="345.00" y2="315.00" class="guide"/><circle cx="255.00" cy="235.63" r="120.00" class="guide"/><path class="result" d="M165.00 315.00 L166.37 316.53 L167.77 318.04 L169.20 319.52 L170.65 320.98 L172.12 322.41 L173.62 323.82 L175.14 325.20 L176.69 326.55 L178.26 327.88 L179.85 329.18 L181.46 330.46 L183.10 331.70 L184.76 332.92 L186.43 334.11 L188.13 335.27 L189.85 336.40 L191.58 337.50 L193.34 338.57 L195.11 339.61 L196.90 340.62 L198.71 341.60 L200.53 342.55 L202.37 343.47 L204.23 344.36 L206.10 345.21 L207.98 346.03 L209.88 346.82 L211.79 347.58 L213.72 348.30 L215.65 348.99 L217.60 349.65 L219.56 350.27 L221.53 350.86 L223.51 351.42 L225.50 351.94 L227.49 352.43 L229.50 352.89 L231.51 353.31 L233.53 353.69 L235.55 354.04 L237.59 354.36 L239.62 354.64 L241.66 354.88 L243.71 355.10 L245.76 355.27 L247.81 355.41 L249.86 355.52 L251.92 355.59 L253.97 355.62 L256.03 355.62 L258.08 355.59 L260.14 355.52 L262.19 355.41 L264.24 355.27 L266.29 355.10 L268.34 354.88 L270.38 354.64 L272.41 354.36 L274.45 354.04 L276.47 353.69 L278.49 353.31 L280.50 352.89 L282.51 352.43 L284.50 351.94 L286.49 351.42 L288.47 350.86 L290.44 350.27 L292.40 349.65 L294.35 348.99 L296.28 348.30 L298.21 347.58 L300.12 346.82 L302.02 346.03 L303.90 345.21 L305.77 344.36 L307.63 343.47 L309.47 342.55 L311.29 341.60 L313.10 340.62 L314.89 339.61 L316.66 338.57 L318.42 337.50 L320.15 336.40 L321.87 335.27 L323.57 334.11 L325.24 332.92 L326.90 331.70 L328.54 330.46 L330.15 329.18 L331.74 327.88 L333.31 326.55 L334.86 325.20 L336.38 323.82 L337.88 322.41 L339.35 320.98 L340.80 319.52 L342.23 318.04 L343.63 316.53 L345.00 315.00"/><circle cx="165.00" cy="315.00" r="5.20" class="dot"/><text class="lab" x="174.00" y="305.00">A</text><circle cx="345.00" cy="315.00" r="5.20" class="dot"/><text class="lab" x="354.00" y="305.00">B</text><circle cx="255.00" cy="235.63" r="5.20" class="dot"/><text class="lab" x="265.00" y="224.63">O</text><circle cx="255.00" cy="355.63" r="5.20" class="dot"/><text class="lab" x="265.00" y="373.63">M</text><line x1="255.00" y1="235.63" x2="165.00" y2="315.00" class="aux"/><line x1="255.00" y1="235.63" x2="345.00" y2="315.00" class="aux"/><line x1="255.00" y1="235.63" x2="255.00" y2="355.63" class="aux"/><text x="509" y="166" class="txt">A、B 只能确定弦的位置。</text><text x="509" y="210" class="txt">如果题设给定半径，才可以找圆心。</text><text x="509" y="262" class="txt">圆心 O 到 A、B 的距离相同。</text><text x="509" y="305" class="txt">M 是弧上最凹的位置，不是圆心。</text><text x="509" y="376" class="txt">不能仅凭两个端点猜一段圆弧。</text><text x="509" y="424" class="txt">还要排除凹向相反的候选圆心。</text><text x="509" y="492" class="mini">本图是简化画法的构造例子，</text><text x="509" y="520" class="mini">并非教材 3-7-5 的原半径尺寸。</text><text x="28" y="640" class="mini">黑：实体轮廓　蓝虚：辅助线　橙：公共点　青：推导的投影路径（不代表最终线型）</text></svg>