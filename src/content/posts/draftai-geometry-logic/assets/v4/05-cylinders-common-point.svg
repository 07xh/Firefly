<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="两个圆柱的公共点：为什么又可能出现两支？"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:24px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.lab{font-size:15px;fill:#ad6020}.outline{fill:none;stroke:#1e2b35;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.guide{fill:none;stroke:#a7b2bc;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.7;stroke-dasharray:6 4}.axis{fill:none;stroke:#8798a6;stroke-width:1.2;stroke-dasharray:13 4 2 4}.result{fill:none;stroke:#13867b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hi{stroke:#c57942;stroke-width:2;fill:none}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.near{stroke:#243747;fill:#dcecf3;stroke-width:2.2}.far{stroke:#899da9;fill:#e5e7eb;stroke-width:1.7}</style><text x="28" y="40" class="title">两个圆柱的公共点：为什么又可能出现两支？</text><text x="28" y="67" class="mini">独立正交圆柱模型。每个公共点同时满足两个圆柱的真实表面条件。</text><rect class="panel" x="45" y="83" width="420" height="263" rx="10"/><rect class="panel" x="45" y="360" width="420" height="264" rx="10"/><rect class="panel" x="488" y="83" width="392" height="263" rx="10"/><rect class="panel" x="488" y="360" width="392" height="264" rx="10"/><text x="65" y="113" class="txt">主视 V：目标点从两个投影取得</text><text x="65" y="387" class="txt">俯视 H：竖圆柱给左右位置</text><text x="506" y="113" class="txt">左视 W：横圆柱给高度</text><text x="507" y="388" class="txt">同深度对应：前后不能调换</text><line x1="146.00" y1="120.00" x2="146.00" y2="310.00" class="outline"/><line x1="346.00" y1="120.00" x2="346.00" y2="310.00" class="outline"/><line x1="246.00" y1="120.00" x2="246.00" y2="310.00" class="axis"/><circle cx="246.00" cy="493.00" r="100.00" class="outline"/><line x1="136.00" y1="493.00" x2="356.00" y2="493.00" class="axis"/><line x1="246.00" y1="383.00" x2="246.00" y2="603.00" class="axis"/><circle cx="690.00" cy="214.00" r="60.00" class="outline"/><line x1="615.00" y1="214.00" x2="765.00" y2="214.00" class="axis"/><line x1="690.00" y1="139.00" x2="690.00" y2="289.00" class="axis"/><line x1="136.00" y1="457.00" x2="356.00" y2="457.00" class="aux"/><line x1="654.00" y1="144.00" x2="654.00" y2="284.00" class="aux"/><line x1="152.70" y1="457.00" x2="152.70" y2="166.00" class="aux"/><line x1="339.30" y1="457.00" x2="339.30" y2="166.00" class="aux"/><line x1="654.00" y1="166.00" x2="339.30" y2="166.00" class="aux"/><circle cx="152.70" cy="457.00" r="5.20" class="dot"/><text class="lab" x="152.70" y="447.00">Pₕ左</text><circle cx="339.30" cy="457.00" r="5.20" class="dot"/><text class="lab" x="347.30" y="447.00">Pₕ右</text><circle cx="654.00" cy="166.00" r="5.20" class="dot"/><text class="lab" x="664.00" y="156.00">P𝓌</text><circle cx="152.70" cy="166.00" r="5.20" class="dot"/><text class="lab" x="160.70" y="154.00">Pᵥ左</text><circle cx="339.30" cy="166.00" r="5.20" class="dot"/><text class="lab" x="347.30" y="154.00">Pᵥ右</text><text x="509" y="435" class="txt">左视给高度和深度；</text><text x="509" y="474" class="mini">俯视用相同深度截取另一圆柱。</text><text x="509" y="513" class="mini">同一 W 点对应两个 x 候选，</text><text x="509" y="540" class="mini">不能随意删除其中一个。</text><text x="28" y="640" class="mini">黑：实体轮廓　蓝虚：辅助线　橙：公共点　青：推导的投影路径（不代表最终线型）</text></svg>