<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="复杂组合体：轮廓高度与遮挡不是同一件事"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:24px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.lab{font-size:15px;fill:#ad6020}.outline{fill:none;stroke:#1e2b35;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.guide{fill:none;stroke:#a7b2bc;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.7;stroke-dasharray:6 4}.axis{fill:none;stroke:#8798a6;stroke-width:1.2;stroke-dasharray:13 4 2 4}.result{fill:none;stroke:#13867b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hi{stroke:#c57942;stroke-width:2;fill:none}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.near{stroke:#243747;fill:#dcecf3;stroke-width:2.2}.far{stroke:#899da9;fill:#e5e7eb;stroke-width:1.7}</style><text x="28" y="40" class="title">复杂组合体：轮廓高度与遮挡不是同一件事</text><text x="28" y="67" class="mini">分开比较近、远实体的高度。高处未必靠近观察者，近处也不必然挡住所有远处表面。</text><rect class="panel" x="44" y="86" width="405" height="538" rx="10"/><rect class="panel" x="474" y="86" width="406" height="538" rx="10"/><text x="65" y="117" class="txt">从左侧看：近侧与远侧实体分开</text><rect x="98" y="390" width="297" height="120" class="far"/><rect x="244" y="358" width="151" height="152" class="near"/><rect x="98" y="418" width="146" height="92" class="near"/><text x="65" y="548" class="mini">后半段：近侧23，远侧30（露出）</text><text x="65" y="574" class="mini">前半段：近侧38，远侧30（被挡）</text><text x="73" y="599" class="mini">本图是两层实体的侧向比较</text><path class="outline" d="M527.00 509.00 L527.00 389.00 L679.00 389.00 L679.00 357.00 L825.00 357.00 L825.00 509.00 L527.00 509.00"/><line x1="527.00" y1="417.00" x2="679.00" y2="417.00" class="aux"/><line x1="679.00" y1="389.00" x2="679.00" y2="357.00" class="result"/><text x="522" y="547" class="mini">后方（纸面左）</text><text x="725" y="547" class="mini">前方（纸面右）</text><text x="498" y="577" class="mini">蓝线仅表示要另查的内部棱，</text><text x="498" y="604" class="mini">不能直接当成正式隐藏线。</text><text x="28" y="640" class="mini">黑：实体轮廓　蓝虚：辅助线　橙：公共点　青：推导的投影路径（不代表最终线型）</text></svg>