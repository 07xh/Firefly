<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="为什么一个主视点会产生两个俯视点？"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:25px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.label{font-size:15px;fill:#b45e21}.outline{fill:none;stroke:#1c2933;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#8c9fab;stroke-width:1.2;stroke-dasharray:13 4 2 4}.guide{fill:none;stroke:#a6b1ba;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.75;stroke-dasharray:7 4}.result{fill:none;stroke:#0d877b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.rectfill{fill:#e9f2f6;stroke:#1c2933;stroke-width:2}.hi{stroke:#bc7543;stroke-width:2;fill:none}</style><text x="28" y="40" class="title">为什么一个主视点会产生两个俯视点？</text><text x="28" y="67" class="mini">同一正圆锥＋积聚为主视斜线的截平面；辅助圆、投射线和交点按同一尺寸计算。</text><rect class="panel" x="50" y="86" width="408" height="250" rx="10"/><rect class="panel" x="50" y="353" width="408" height="265" rx="10"/><rect class="panel" x="490" y="87" width="389" height="531" rx="10"/><text x="70" y="117" class="txt">主视 V：P 已在斜截线上</text><text x="70" y="380" class="txt">俯视 H：两个条件的公共位置</text><path class="outline" d="M126.00 309.00 L246.00 109.00 L366.00 309.00 L126.00 309.00"/><line x1="246.00" y1="97.00" x2="246.00" y2="323.00" class="axis"/><line x1="116.00" y1="199.40" x2="376.00" y2="199.40" class="aux"/><path class="hi" d="M166.00 241.00 L326.00 177.00"/><circle cx="270.00" cy="199.40" r="5.2" class="dot"/><text x="280.00" y="190.40" class="label">Pᵥ</text><circle cx="246.00" cy="475.00" r="120.00" class="guide"/><circle cx="246.00" cy="475.00" r="54.24" class="aux"/><line x1="246.00" y1="343.00" x2="246.00" y2="607.00" class="axis"/><line x1="114.00" y1="475.00" x2="378.00" y2="475.00" class="axis"/><line x1="270.00" y1="199.40" x2="270.00" y2="547.24" class="aux"/><circle cx="270.00" cy="426.36" r="5.2" class="dot"/><text x="280.00" y="417.36" class="label">Pₕ后</text><circle cx="270.00" cy="523.64" r="5.2" class="dot"/><text x="280.00" y="541.64" class="label">Pₕ前</text><text x="514" y="133" class="txt">① 主视 P：给出高度及左右位置</text><text x="514" y="178" class="txt">② 水平辅助圆：给出圆锥侧面范围</text><text x="514" y="223" class="txt">③ 垂直投射线：保留 P 的左右位置</text><text x="514" y="270" class="txt">④ 两条条件交于前、后两点</text><text x="514" y="316" class="txt">⑤ 两点不能直接跨圆连直线</text><text x="514" y="390" class="txt">排除错误位置：</text><text x="514" y="427" class="mini">不在辅助圆上 → 不属于圆锥表面</text><text x="514" y="458" class="mini">不在投射线上 → 不属于主视 P</text><text x="514" y="505" class="mini">若相切只有一点；不相交则无点</text><text x="28" y="642" class="mini">黑：形体与原始轮廓　蓝色虚线：辅助线　橙：公共点　青：求得的轨迹（非最终实虚线）</text></svg>