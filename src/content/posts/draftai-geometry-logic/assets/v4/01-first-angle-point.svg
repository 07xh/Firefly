<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="第一角法：同一个空间点如何转到三个视图"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:25px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.label{font-size:15px;fill:#b45e21}.outline{fill:none;stroke:#1c2933;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#8c9fab;stroke-width:1.2;stroke-dasharray:13 4 2 4}.guide{fill:none;stroke:#a6b1ba;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.75;stroke-dasharray:7 4}.result{fill:none;stroke:#0d877b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.rectfill{fill:#e9f2f6;stroke:#1c2933;stroke-width:2}.hi{stroke:#bc7543;stroke-width:2;fill:none}</style><text x="28" y="40" class="title">第一角法：同一个空间点如何转到三个视图</text><text x="28" y="67" class="mini">示例约定：俯视中心线以上为后方；左视中心线左侧为后方。45°线在右下角。</text><rect class="panel" x="60" y="87" width="410" height="188" rx="8"/><rect class="panel" x="60" y="323" width="410" height="238" rx="8"/><rect class="panel" x="502" y="87" width="380" height="188" rx="8"/><rect class="panel" x="502" y="323" width="380" height="238" rx="8"/><text x="82" y="118" class="txt">主视 V：左右与高度</text><text x="82" y="351" class="txt">俯视 H：左右与前后</text><text x="527" y="118" class="txt">左视 W：前后与高度</text><text x="527" y="351" class="txt">45°深度转移</text><line x1="220.00" y1="129.00" x2="220.00" y2="259.00" class="axis"/><line x1="118.00" y1="260.00" x2="328.00" y2="260.00" class="axis"/><line x1="220.00" y1="378.00" x2="220.00" y2="532.00" class="axis"/><line x1="110.00" y1="445.00" x2="330.00" y2="445.00" class="axis"/><line x1="660.00" y1="129.00" x2="660.00" y2="259.00" class="axis"/><line x1="565.00" y1="260.00" x2="787.00" y2="260.00" class="axis"/><line x1="260.00" y1="160.00" x2="630.00" y2="160.00" class="aux"/><line x1="260.00" y1="160.00" x2="260.00" y2="415.00" class="aux"/><line x1="260.00" y1="415.00" x2="630.00" y2="415.00" class="aux"/><line x1="630.00" y1="415.00" x2="630.00" y2="160.00" class="aux"/><line x1="575.00" y1="360.00" x2="755.00" y2="540.00" class="aux"/><circle cx="260.00" cy="160.00" r="5.2" class="dot"/><text x="270.00" y="151.00" class="label">Pᵥ</text><circle cx="260.00" cy="415.00" r="5.2" class="dot"/><text x="270.00" y="406.00" class="label">Pₕ</text><circle cx="630.00" cy="160.00" r="5.2" class="dot"/><text x="640.00" y="151.00" class="label">P𝓌</text><text x="530" y="580" class="mini">① 主视给高度；俯视给深度</text><text x="530" y="605" class="mini">② 45°只搬运距离，不猜左右</text><text x="28" y="642" class="mini">黑：形体与原始轮廓　蓝色虚线：辅助线　橙：公共点　青：求得的轨迹（非最终实虚线）</text></svg>