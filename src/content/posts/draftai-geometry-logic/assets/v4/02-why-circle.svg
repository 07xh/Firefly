<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" role="img" aria-label="为什么要画辅助圆？先证明圆从哪里来"><rect width="920" height="655" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253747}.title{font-size:25px;font-weight:700}.txt{font-size:16px}.mini{font-size:14px;fill:#526879}.label{font-size:15px;fill:#b45e21}.outline{fill:none;stroke:#1c2933;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#8c9fab;stroke-width:1.2;stroke-dasharray:13 4 2 4}.guide{fill:none;stroke:#a6b1ba;stroke-width:1.4;stroke-dasharray:5 5}.aux{fill:none;stroke:#287fad;stroke-width:1.75;stroke-dasharray:7 4}.result{fill:none;stroke:#0d877b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#e88842;stroke:white;stroke-width:1}.panel{fill:#fafcfd;stroke:#dce6eb;stroke-width:1.2}.rectfill{fill:#e9f2f6;stroke:#1c2933;stroke-width:2}.hi{stroke:#bc7543;stroke-width:2;fill:none}</style><text x="28" y="40" class="title">为什么要画辅助圆？先证明圆从哪里来</text><text x="28" y="67" class="mini">本图只研究完整正圆锥的水平截面，尚未加入斜截平面的第二个条件。</text><rect class="panel" x="50" y="86" width="408" height="250" rx="10"/><rect class="panel" x="50" y="353" width="408" height="265" rx="10"/><rect class="panel" x="490" y="87" width="389" height="531" rx="10"/><text x="70" y="117" class="txt">主视 V：在 P 的高度水平切圆锥</text><text x="70" y="380" class="txt">俯视 H：这一层圆锥的圆周</text><path class="outline" d="M126.00 309.00 L246.00 109.00 L366.00 309.00 L126.00 309.00"/><line x1="246.00" y1="97.00" x2="246.00" y2="324.00" class="axis"/><line x1="118.00" y1="199.40" x2="374.00" y2="199.40" class="aux"/><circle cx="300.24" cy="199.40" r="5.2" class="dot"/><text x="308.24" y="189.40" class="label">轮廓交点 Q</text><line x1="246.00" y1="199.40" x2="300.24" y2="199.40" class="hi"/><circle cx="246.00" cy="475.00" r="120.00" class="guide"/><circle cx="246.00" cy="475.00" r="54.24" class="aux"/><line x1="246.00" y1="340.00" x2="246.00" y2="610.00" class="axis"/><line x1="111.00" y1="475.00" x2="381.00" y2="475.00" class="axis"/><circle cx="246.00" cy="475.00" r="5.2" class="dot"/><text x="256.00" y="466.00" class="label">O</text><circle cx="300.24" cy="475.00" r="5.2" class="dot"/><text x="309.24" y="463.00" class="label">R</text><text x="514" y="132" class="txt">① 不先画圆：先水平“切”正圆锥</text><text x="514" y="178" class="txt">② 同一高度绕轴一圈，边界是圆</text><text x="514" y="224" class="txt">③ 圆心是圆锥轴线的俯视点 O</text><text x="514" y="270" class="txt">④ 半径来自这一高度的轮廓母线</text><text x="514" y="316" class="txt">⑤ 辅助圆不是最终截交线</text><text x="514" y="390" class="txt">为什么不能随便换半径？</text><text x="514" y="428" class="mini">因为那会把点移到不属于</text><text x="514" y="455" class="mini">该高度圆锥表面的位置。</text><text x="28" y="642" class="mini">黑：形体与原始轮廓　蓝色虚线：辅助线　橙：公共点　青：求得的轨迹（非最终实虚线）</text></svg>