<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-label="简化相贯：先认题目规定，再定端点、圆心或转折点"><rect width="900" height="510" rx="24" fill="#f7fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#16344f;font-size:18px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:16px;fill:#57718b}.panel{fill:#fff;stroke:#c9d8e5;stroke-width:2}.edge{stroke:#203c58;stroke-width:3;fill:none}.fine{stroke:#86a6bd;stroke-width:1.9;stroke-dasharray:7 5;fill:none}.work{stroke:#1c83ac;stroke-width:3;fill:none}.result{stroke:#0c8a77;stroke-width:4;fill:none}.point{fill:#f28b43;stroke:#fff;stroke-width:2}</style><text class="title" x="30" y="42">简化相贯：先认题目规定，再定端点、圆心或转折点</text>
<rect class="panel" x="25" y="71" width="410" height="177" rx="10"/><rect class="panel" x="461" y="71" width="410" height="177" rx="10"/>
<rect class="panel" x="25" y="266" width="410" height="177" rx="10"/><rect class="panel" x="461" y="266" width="410" height="177" rx="10"/>
<text x="42" y="100">3-7-1：下凹简化圆弧</text><path class="edge" d="M55 137 V206 H403 V137"/><path class="result" d="M105 137 Q228 235 351 137"/><circle class="point" cx="105" cy="137" r="5"/><circle class="point" cx="351" cy="137" r="5"/><text class="subtitle" x="60" y="228">两肩定端点，题图条件定圆心</text>
<text x="480" y="100">3-7-2：V形是简化，不是尖棱</text><path class="edge" d="M490 137 H843"/><path class="result" d="M532 137 L665 208 L800 137"/><circle class="point" cx="665" cy="208" r="6"/><text class="subtitle" x="486" y="229">对称只能定中轴，不能独定底点高度</text>
<text x="42" y="295">3-7-3：上凹与下凸分开作</text><path class="result" d="M104 329 Q228 410 352 329 M104 408 Q228 338 352 408"/><text class="subtitle" x="60" y="423">两段端点和辅助规则分别核对</text>
<text x="480" y="295">3-7-5：最凹点不是圆心</text><path class="result" d="M769 325 A54 54 0 1 0 769 413"/><circle class="point" cx="684" cy="369" r="6"/><circle class="point" cx="738" cy="369" r="6"/><path class="fine" d="M684 369 H738"/><text class="subtitle" x="487" y="424">圆心须满足同半径，不能拿最凹点代替</text>
<text class="subtitle" x="27" y="483">四个小图是课堂符号示意，用来区分“简化”与“准确求点”，不是教材原图复制品。</text></svg>