<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="图3｜同一圆柱斜截线的三种正投影"><rect width="760" height="440" rx="22" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#15304b;font-size:17px}.note{font-size:14px;fill:#53718c}.heading{font-size:21px;font-weight:700}.main{stroke:#172b4d;stroke-width:3;fill:none}.guide{stroke:#9ab1c5;stroke-width:1.8;stroke-dasharray:6 5;fill:none}.accent{stroke:#147ab7;stroke-width:3;fill:none}.pt{fill:#e27738;stroke:#fff;stroke-width:1.2}</style><text class="heading" x="28" y="36">图3｜同一圆柱斜截线的三种正投影</text><rect x="22" y="70" width="230" height="317" rx="9" fill="white" stroke="#c7d7e2"/><rect x="265" y="70" width="230" height="317" rx="9" fill="white" stroke="#c7d7e2"/><rect x="508" y="70" width="230" height="317" rx="9" fill="white" stroke="#c7d7e2"/><text x="45" y="106">俯视图 (x,y)</text><text x="288" y="106">主视图 (x,z)</text><text x="532" y="106">侧视图 (y,z)</text><circle cx="137" cy="228" r="88" stroke="#1e649a" stroke-width="4" fill="#eaf6fc"/><line class="guide" x1="36" y1="228" x2="236" y2="228"/><line class="guide" x1="137" y1="124" x2="137" y2="332"/><text class="note" x="80" y="357">x²+y²=400</text><rect x="305" y="170" width="150" height="136" stroke="#9fb5c6" stroke-width="2" fill="#eef7fc"/><line class="accent" x1="305" y1="274" x2="455" y2="204"/><circle class="pt" cx="305" cy="274" r="5"/><circle class="pt" cx="455" cy="204" r="5"/><text class="note" x="300" y="357">z=40+0.5x</text><ellipse cx="623" cy="238" rx="85" ry="53" fill="#eef7fc" stroke="#1e649a" stroke-width="4"/><line class="guide" x1="526" y1="238" x2="723" y2="238"/><line class="guide" x1="623" y1="167" x2="623" y2="305"/><text class="note" x="533" y="357">y²/400+(z-40)²/100=1</text><text class="note" x="37" y="409">真实截交线属于同一空间曲线；各视图由于丢失不同坐标，形状可以完全不同</text></svg>