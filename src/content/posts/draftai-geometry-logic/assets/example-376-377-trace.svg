<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-label="3-7-6 / 3-7-7：从一个视图取点，另一个视图补齐条件"><rect width="900" height="510" rx="24" fill="#f7fafc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#16344f;font-size:18px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:16px;fill:#57718b}.panel{fill:#fff;stroke:#c9d8e5;stroke-width:2}.edge{stroke:#203c58;stroke-width:3;fill:none}.fine{stroke:#86a6bd;stroke-width:1.9;stroke-dasharray:7 5;fill:none}.work{stroke:#1c83ac;stroke-width:3;fill:none}.result{stroke:#0c8a77;stroke-width:4;fill:none}.point{fill:#f28b43;stroke:#fff;stroke-width:2}</style><text class="title" x="30" y="42">3-7-6 / 3-7-7：从一个视图取点，另一个视图补齐条件</text>
