<text x="478" y="106">3-7-7：从俯视圆周出发</text><circle class="work" cx="586" cy="265" r="96"/><path class="fine" d="M586 153 V371 M475 265 H696"/><circle class="point" cx="528" cy="188.3" r="7"/>
