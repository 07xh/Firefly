name: Temporary motion formatter
on:
  push:
    paths:
      - ".github/workflows/format-portfolio-motion.yml"
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.5.15"
      - name: Show exact Biome formatting
        run: |
          biome format --write src/scripts/portfolio-motion.ts
          echo "FORMAT_START"
          cat src/scripts/portfolio-motion.ts
          echo "FORMAT_END"
