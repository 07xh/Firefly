name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build for Cloudflare Workers
        run: pnpm run build
        env:
          CF_WORKERS: "1"
      - name: Ensure session KV namespace exists and bind it
        shell: bash
        run: |
          set -euo pipefail
          namespaces="$(pnpm exec wrangler kv namespace list)"
          namespace_id="$(printf '%s' "$namespaces" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(input);
              const match = rows.find((row) =>
                row.title === "firefly-FIREFLY_SESSIONS" ||
                row.title === "FIREFLY_SESSIONS"
              );
              if (match) process.stdout.write(match.id);
            });
          ')"
          if [ -z "$namespace_id" ]; then
            created="$(pnpm exec wrangler kv namespace create FIREFLY_SESSIONS)"
            namespace_id="$(printf '%s' "$created" | grep -Eo '[a-f0-9]{32}' | tail -n 1 || true)"
          fi
          if ! [[ "$namespace_id" =~ ^[a-f0-9]{32}$ ]]; then
            echo "Unable to resolve a valid FIREFLY_SESSIONS namespace ID."
            exit 1
          fi
          export FIREFLY_SESSIONS_NAMESPACE_ID="$namespace_id"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const id = process.env.FIREFLY_SESSIONS_NAMESPACE_ID;
          // Astro's Cloudflare adapter writes the deployable Wrangler config
          // alongside its built Worker under dist/server/.
          const configPath = "dist/server/wrangler.json";
          if (!fs.existsSync(configPath)) {
            throw new Error("Astro Cloudflare build did not generate dist/server/wrangler.json");
          }
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          if (!config.main) throw new Error("Generated Wrangler config has no Worker main entrypoint");
          const kv = (config.kv_namespaces ?? []).find((item) => item.binding === "FIREFLY_SESSIONS");
          if (kv) {
            kv.id = id;
          } else {
            config.kv_namespaces = [...(config.kv_namespaces ?? []), { binding: "FIREFLY_SESSIONS", id }];
          }
          if (config.assets) config.assets.binding = config.assets.binding || "ASSETS";
          if (process.env.ENABLE_CUSTOM_DOMAIN_ROUTE === "true") {
            config.routes = [{ pattern: "0701000.xyz/*", zone_name: "0701000.xyz" }];
            config.workers_dev = false;
            console.log("Custom-domain route explicitly enabled by ENABLE_CUSTOM_DOMAIN_ROUTE.");
          } else {
            delete config.routes;
            config.workers_dev = true;
            console.log("Custom-domain route disabled by default; using workers.dev so deployment does not require Zone route permissions.");
          }
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          console.log("Injected FIREFLY_SESSIONS into the generated Worker config.");
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_CUSTOM_DOMAIN_ROUTE: ${{ secrets.ENABLE_CUSTOM_DOMAIN_ROUTE }}
      - name: Sync optional runtime secrets from GitHub Actions
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREFLY_ADMIN_PASSWORD: ${{ secrets.FIREFLY_ADMIN_PASSWORD }}
          GITHUB_CONTENTS_TOKEN: ${{ secrets.GITHUB_CONTENTS_TOKEN }}
        run: |
          set -euo pipefail
          config="dist/server/wrangler.json"
          if [ -n "${FIREFLY_ADMIN_PASSWORD:-}" ]; then
            printf '%s' "$FIREFLY_ADMIN_PASSWORD" | pnpm exec wrangler secret put FIREFLY_ADMIN_PASSWORD --config "$config"
          else
            echo "::notice::FIREFLY_ADMIN_PASSWORD was not supplied as an Actions secret; keep/configure it in the Cloudflare Worker settings."
          fi
          if [ -n "${GITHUB_CONTENTS_TOKEN:-}" ]; then
            printf '%s' "$GITHUB_CONTENTS_TOKEN" | pnpm exec wrangler secret put GITHUB_CONTENTS_TOKEN --config "$config"
          else
            echo "::notice::GITHUB_CONTENTS_TOKEN was not supplied as an Actions secret; keep/configure it in the Cloudflare Worker settings."
          fi
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test public admin routes and runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          export PUBLIC_BASE_URL="https://firefly.3267597860.workers.dev"
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from "node:timers/promises";
          const base = process.env.PUBLIC_BASE_URL;
          async function check(name, run) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const result = await run();
                console.log("PASS: " + name + " — " + result);
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 6) await delay(3000);
              }
            }
            throw new Error(name + " failed: " + (lastError?.message ?? "unknown error"));
          }
          async function jsonResponse(response) {
            const type = response.headers.get("content-type") || "";
            if (!type.toLowerCase().includes("application/json")) {
              const body = (await response.text()).slice(0, 200);
              throw new Error("expected JSON but got HTTP " + response.status + " (" + type + "): " + body);
            }
            return response.json();
          }
          await check("login page", async () => {
            const response = await fetch(base + "/admin/login/", { redirect: "manual" });
            const body = await response.text();
            if (response.status !== 200 || !body.includes('id="loginForm"')) {
              throw new Error("expected HTTP 200 with login form, got HTTP " + response.status);
            }
            return "HTTP 200";
          });
          await check("protected admin page", async () => {
            const response = await fetch(base + "/admin/", { redirect: "manual" });
            const location = response.headers.get("location") || "";
            if (response.status !== 302 || !location.includes("/admin/login/")) {
              throw new Error("expected 302 redirect to login, got HTTP " + response.status + " location=" + location);
            }
            return "HTTP 302 to login";
          });
          await check("KV session binding", async () => {
            const response = await fetch(base + "/api/admin/articles", { redirect: "manual" });
            const data = await jsonResponse(response);
            if (response.status !== 401 || !String(data.error || "").includes("登录")) {
              throw new Error("expected unauthenticated HTTP 401; got HTTP " + response.status + " body=" + JSON.stringify(data));
            }
            return "unauthenticated API correctly returns HTTP 401";
          });
          await check("login runtime configuration", async () => {
            const response = await fetch(base + "/api/auth/login", {
              method: "POST", redirect: "manual",
              headers: { "Origin": base, "Content-Type": "application/json" },
              body: "{}"
            });
            const data = await jsonResponse(response);
            if (response.status !== 400) {
              throw new Error("expected HTTP 400 for a deliberately incomplete login request (HTTP 503 means password/KV is not configured); got HTTP " + response.status + " body=" + JSON.stringify(data));
            }
            return "runtime password and KV are available; malformed request rejected with HTTP 400";
          });
          await check("protected Markdown preview API", async () => {
            const response = await fetch(base + "/api/admin/preview", {
              method: "POST", redirect: "manual",
              headers: { "Origin": base, "Content-Type": "application/json" },
              body: JSON.stringify({ markdown: "# smoke test" })
            });
            const data = await jsonResponse(response);
            if (response.status !== 401) {
              throw new Error("expected unauthenticated HTTP 401, got HTTP " + response.status + " body=" + JSON.stringify(data));
            }
            return "unauthenticated preview API correctly returns HTTP 401";
          });
          NODE
      - name: Check custom domain binding (non-blocking diagnostic)
        shell: bash
        run: |
          set -u
          node --input-type=module <<'NODE'
          const base = "https://0701000.xyz";
          try {
            const login = await fetch(base + "/admin/login/", { redirect: "manual" });
            const body = await login.text();
            const protectedPage = await fetch(base + "/admin/", { redirect: "manual" });
            const protectedLocation = protectedPage.headers.get("location") || "";
            const api = await fetch(base + "/api/admin/articles", { redirect: "manual" });
            const apiType = api.headers.get("content-type") || "";
            if (login.status === 200 && body.includes('id="loginForm"') &&
                protectedPage.status === 302 && protectedLocation.includes("/admin/login/") &&
                api.status === 401 && apiType.toLowerCase().includes("application/json")) {
              console.log("PASS: 0701000.xyz routes to the protected Firefly Worker.");
            } else {
              console.log("::warning::0701000.xyz is not confirmed to route to the Firefly Worker. Login HTTP " +
                login.status + ", protected page HTTP " + protectedPage.status +
                ", admin API HTTP " + api.status + " (" + apiType +
                "). Check Cloudflare Zone/Worker route permissions or set ENABLE_CUSTOM_DOMAIN_ROUTE after granting them.");
            }
          } catch (error) {
            console.log("::warning::Unable to verify custom domain: " + (error?.message ?? String(error)));
          }
          NODE

# Deployment credentials are configured in repository Actions secrets; runtime secrets may also remain configured in the Cloudflare dashboard.
