name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build for Cloudflare Workers
        run: pnpm run build
        env:
          CF_WORKERS: "1"
      - name: Ensure session KV namespace exists and bind it
        shell: bash
        run: |
          set -euo pipefail
          namespaces="$(pnpm exec wrangler kv namespace list)"
          namespace_id="$(printf '%s' "$namespaces" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(input);
              const match = rows.find((row) =>
                row.title === "firefly-FIREFLY_SESSIONS" ||
                row.title === "FIREFLY_SESSIONS"
              );
              if (match) process.stdout.write(match.id);
            });
          ')"
          if [ -z "$namespace_id" ]; then
            created="$(pnpm exec wrangler kv namespace create FIREFLY_SESSIONS)"
            namespace_id="$(printf '%s' "$created" | grep -Eo '[a-f0-9]{32}' | tail -n 1 || true)"
          fi
          if ! [[ "$namespace_id" =~ ^[a-f0-9]{32}$ ]]; then
            echo "Unable to resolve a valid FIREFLY_SESSIONS namespace ID."
            exit 1
          fi
          export FIREFLY_SESSIONS_NAMESPACE_ID="$namespace_id"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const id = process.env.FIREFLY_SESSIONS_NAMESPACE_ID;
          const tomlPath = "wrangler.toml";
          let toml = fs.readFileSync(tomlPath, "utf8");
          const binding = /\[\[kv_namespaces\]\]\s*\nbinding = "FIREFLY_SESSIONS"(?:\s*\nid = "[^"]*")?/;
          if (!binding.test(toml)) throw new Error("FIREFLY_SESSIONS binding missing from wrangler.toml");
          toml = toml.replace(binding, `[[kv_namespaces]]\nbinding = "FIREFLY_SESSIONS"\nid = "${id}"`);
          fs.writeFileSync(tomlPath, toml);
          const jsonPath = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
          const kv = config.kv_namespaces?.find((item) => item.binding === "FIREFLY_SESSIONS");
          if (!kv) throw new Error("FIREFLY_SESSIONS binding missing from wrangler.jsonc");
          kv.id = id;
          fs.writeFileSync(jsonPath, JSON.stringify(config, null, 2) + "\n");
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Deployment credentials are configured in repository Actions secrets.
