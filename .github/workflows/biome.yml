name: Code quality

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: 2.5.15
      - name: Run Biome
        run: biome ci --config-path=biome.json ./src --reporter=summary
      - name: Temporary formatter output for upload handler
        if: always()
        run: |
          biome format --config-path=biome.json --write ./src/pages/api/admin/upload.ts
          node -e "const fs=require('node:fs'); console.log('UPLOAD_BIOME_FORMATTED_B64='+Buffer.from(fs.readFileSync('./src/pages/api/admin/upload.ts')).toString('base64'))"
