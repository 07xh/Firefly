name: Code quality

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master, feat/ai-natural-language-authoring-20261019 ] # Include the stacked AI authoring feature base

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: 2.5.15
      - name: Preview system health Biome fixes
        run: |
          biome check --write --config-path=biome.json src/lib/admin-system-health.ts src/pages/api/admin/system-health.ts
          git diff -- src/lib/admin-system-health.ts src/pages/api/admin/system-health.ts
      - name: Run Biome
        run: biome ci --config-path=biome.json ./src --reporter=summary
