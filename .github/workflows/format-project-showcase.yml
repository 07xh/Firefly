name: Temporary format project showcase
on:
  push:
    paths:
      - ".github/workflows/format-project-showcase.yml"
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.5.15"
      - name: Produce exact Astro formatting
        run: |
          biome format --write 'src/pages/projects/[slug].astro'
          echo "SHOWCASE_START"
          cat 'src/pages/projects/[slug].astro'
          echo "SHOWCASE_END"
