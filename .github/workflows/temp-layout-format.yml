name: Temporary layout formatting helper
on:
  push:
    branches:
      - feature/admin-layout-switcher
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780
        with:
          version: 2.5.15
      - name: Format files and commit if changed
        run: |
          biome format --write src/config/siteConfig.ts src/config/sidebarConfig.ts src/data/settings.json src/pages/api/admin/upload.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/siteConfig.ts src/config/sidebarConfig.ts src/data/settings.json src/pages/api/admin/upload.ts
          if git diff --cached --quiet; then
            echo "All target files already formatted."
          else
            git commit -m "Format layout configuration files"
            git push origin HEAD:feature/admin-layout-switcher
          fi
